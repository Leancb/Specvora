openapi: 3.0.3
info:
  title: Petstore demo
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pet found
        '404':
          description: Pet not found
        '429':
          description: Rate limit fixture response
        '503':
          description: Dependency failure fixture response
      x-specvora-test-fixtures:
        '429':
          kind: request-header
          name: X-Specvora-Fixture
          value: rate-limit
        '503':
          kind: request-header
          name: X-Specvora-Fixture
          value: dependency-failure
