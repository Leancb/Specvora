[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specvora"
version = "0.1.0"
description = "Autonomous Quality Engineering from requirements to release confidence"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Leandro do Couto Brum" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai-agents>=0.2,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
specvora = "specvora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specvora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
source = ["specvora"]

[tool.coverage.report]
fail_under = 85
show_missing = true

